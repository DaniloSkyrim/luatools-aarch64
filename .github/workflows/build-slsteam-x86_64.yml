name: build-slsteam-x86_64

# Produces the x86-64 SLSsteam binary the installer downloads. The build is the
# upstream dev-X86_64 tree unchanged: its bundles are already ELF64 x86-64 and
# its 17 signatures match the current steamrt64/steamclient.so.
#
# Published asset (stable URL):
#   https://github.com/DaniloSkyrim/luatools-aarch64/releases/download/slsteam-x86_64/slsteam-x86_64.zip

on:
  push:
    branches: [main, master]
    paths:
      - 'build/build-slsteam-x86_64.sh'
      - '.github/workflows/build-slsteam-x86_64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libcurl4-openssl-dev \
            libdbus-1-dev libluajit-5.1-dev g++-12 gcc-12

      - name: Build SLSsteam x86-64
        run: |
          chmod +x build/build-slsteam-x86_64.sh
          build/build-slsteam-x86_64.sh dist

      - name: Verify ELF class
        run: |
          file dist/slsteam-x86_64/bin/SLSsteam.so
          file -b dist/slsteam-x86_64/bin/SLSsteam.so | grep -q 'ELF 64-bit'
          if [ -e dist/slsteam-x86_64/bin/library-inject.so ]; then
            file dist/slsteam-x86_64/bin/library-inject.so
            file -b dist/slsteam-x86_64/bin/library-inject.so | grep -q 'ELF 64-bit'
          fi

      - name: Fetch the live Steam x86-64 client
        run: python3 tools/fetch_steam_x64.py /tmp/steam-target

      - name: Verify SLSsteam signatures against the live client
        run: |
          python3 tools/check_patterns.py \
            .build/src/src/patterns.cpp \
            /tmp/steam-target/steamrt64/steamclient.so | tee /tmp/patterns.txt
          grep -q 'ambiguous=0 missing=0' /tmp/patterns.txt

      # Best-effort: the hook resolves the transport vtable through RTTI and the
      # tree has x86-64 branches, so a 64-bit build is plausible. If it does not
      # compile, the SLSsteam artifact is still published and the installer
      # simply leaves CloudRedirect out.
      - name: Build CloudRedirect x86-64 (best effort)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch master https://github.com/swwayps/cloudredirect-moon /tmp/cr
          cd /tmp/cr
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
                -DCR_GIT_SHA="$(git rev-parse --short=7 HEAD)"
          cmake --build build --target cloud_redirect cloud_redirect_cli -j"$(nproc)"
          file build/cloud_redirect.so build/cloud_redirect_cli
          file -b build/cloud_redirect.so | grep -q 'ELF 64-bit'
          file -b build/cloud_redirect_cli | grep -q 'ELF 64-bit'
          mkdir -p "$GITHUB_WORKSPACE/dist/cloudredirect-x86_64"
          cp build/cloud_redirect.so build/cloud_redirect_cli \
             "$GITHUB_WORKSPACE/dist/cloudredirect-x86_64/"

      - name: Package
        run: |
          cd dist
          zip -qr slsteam-x86_64.zip slsteam-x86_64
          unzip -l slsteam-x86_64.zip
          if [ -d cloudredirect-x86_64 ]; then
            zip -qr cloudredirect-x86_64.zip cloudredirect-x86_64
            unzip -l cloudredirect-x86_64.zip
          fi

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slsteam-x86_64
          name: SLSsteam x86-64 (DroidDeck)
          body: |
            SLSsteam built from AceSLS/SLSsteam `dev-X86_64` for the x86-64
            Steam client used by DroidDeck's x86-64 mode.
          files: dist/*.zip
          make_latest: false
